<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Deadlock Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
        }

        header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            padding: 30px;
            border: 1px solid #1e3a5f;
        }

        header h1 {
            color: #00d9ff;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        header .lead {
            color: #a8dadc;
            margin-bottom: 0;
        }

        .card {
            background: #1e3a5f;
            border: 1px solid #2d5a7b;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: #00d9ff;
            border-radius: 15px 15px 0 0 !important;
            font-weight: bold;
            border-bottom: 2px solid #00d9ff;
        }

        .card-header h5 {
            margin: 0;
        }

        .terminal-output, .analysis-output {
            background: #0a1929;
            color: #00ff00;
            padding: 20px;
            border-radius: 8px;
            min-height: 200px;
            max-height: 450px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 2px solid #1e3a5f;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .analysis-output {
            color: #e0e0e0;
        }

        .btn {
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: #000;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #00ffff 0%, #00d9ff 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 217, 255, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
            color: #000;
        }

        .btn-success:hover:not(:disabled) {
            background: linear-gradient(135deg, #00ffaa 0%, #00ff88 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 255, 136, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffa500 0%, #ff8c00 100%);
            color: #000;
        }

        .btn-warning:hover:not(:disabled) {
            background: linear-gradient(135deg, #ffb733 0%, #ffa500 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 165, 0, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
            color: #fff;
        }

        .btn-danger:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff6b7a 0%, #ff4757 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 71, 87, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-control {
            background: #0a1929;
            border: 2px solid #2d5a7b;
            color: #e0e0e0;
            border-radius: 8px;
        }

        .form-control:focus {
            background: #0a1929;
            border-color: #00d9ff;
            color: #e0e0e0;
            box-shadow: 0 0 0 0.2rem rgba(0, 217, 255, 0.25);
        }

        #uploadStatus {
            font-weight: bold;
            margin-top: 10px;
        }

        .success-text {
            color: #00ff88;
        }

        .error-text {
            color: #ff4757;
        }

        .terminal-output::-webkit-scrollbar,
        .analysis-output::-webkit-scrollbar {
            width: 10px;
        }

        .terminal-output::-webkit-scrollbar-track,
        .analysis-output::-webkit-scrollbar-track {
            background: #0a1929;
        }

        .terminal-output::-webkit-scrollbar-thumb,
        .analysis-output::-webkit-scrollbar-thumb {
            background: #2d5a7b;
            border-radius: 5px;
        }

        .terminal-output::-webkit-scrollbar-thumb:hover,
        .analysis-output::-webkit-scrollbar-thumb:hover {
            background: #3d6a8b;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .deadlock-detected {
            color: #ff4757;
            font-weight: bold;
            font-size: 1.3em;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.8);
        }

        .no-deadlock {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <header class="text-center">
            <h1>🔍 Live Deadlock Detector</h1>
            <p class="lead">Runtime Deadlock Analysis System</p>
        </header>

        <div class="row">
            <div class="col-md-10 mx-auto">
                
                <!-- File Upload Section -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>📁 Upload C Program</h5>
                    </div>
                    <div class="card-body">
                        <input type="file" id="fileInput" accept=".c" class="form-control mb-3">
                        <button onclick="uploadFile()" class="btn btn-primary" id="uploadBtn">
                            📤 Upload File
                        </button>
                        <div id="uploadStatus"></div>
                    </div>
                </div>

                <!-- Control Panel -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>🎮 Control Panel</h5>
                    </div>
                    <div class="card-body">
                        <button onclick="compileProgram()" class="btn btn-success me-2 mb-2" id="compileBtn" disabled>
                            🔨 Compile Program
                        </button>
                        <button onclick="runProgram()" class="btn btn-warning me-2 mb-2" id="runBtn" disabled>
                            ▶️ Run with Wrapper
                        </button>
                        <button onclick="analyzeDeadlock()" class="btn btn-danger mb-2" id="analyzeBtn" disabled>
                            🔍 Analyze Deadlock
                        </button>
                    </div>
                </div>

                <!-- Terminal Output -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>📟 Terminal Output</h5>
                    </div>
                    <div class="card-body">
                        <pre id="terminalOutput" class="terminal-output">Waiting for file upload...</pre>
                    </div>
                </div>

                <!-- Analysis Result -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>🔬 Deadlock Analysis</h5>
                    </div>
                    <div class="card-body">
                        <pre id="analysisResult" class="analysis-output">No analysis yet...</pre>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        let uploadedFileName = '';

        // Upload file
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const uploadStatus = document.getElementById('uploadStatus');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                uploadStatus.innerHTML = '<span class="error-text">❌ Please select a file first</span>';
                return;
            }
            
            const file = fileInput.files[0];
            
            if (!file.name.endsWith('.c')) {
                uploadStatus.innerHTML = '<span class="error-text">❌ Only .c files are allowed</span>';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            uploadStatus.innerHTML = '<span class="loading">⏳ Uploading...</span>';
            
            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    uploadedFileName = data.filename;
                    uploadStatus.innerHTML = `<span class="success-text">✅ Uploaded: ${file.name}</span>`;
                    document.getElementById('compileBtn').disabled = false;
                    document.getElementById('terminalOutput').textContent = `File uploaded successfully: ${file.name}\nReady to compile...`;
                } else {
                    uploadStatus.innerHTML = `<span class="error-text">❌ Error: ${data.error}</span>`;
                }
            } catch (error) {
                uploadStatus.innerHTML = `<span class="error-text">❌ Upload failed: ${error.message}</span>`;
            }
        }

        // Compile program
        async function compileProgram() {
            const terminalOutput = document.getElementById('terminalOutput');
            const compileBtn = document.getElementById('compileBtn');
            
            compileBtn.disabled = true;
            terminalOutput.textContent = '⏳ Compiling program...\n';
            terminalOutput.classList.add('loading');
            
            try {
                const response = await fetch(`${API_BASE}/compile`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                terminalOutput.classList.remove('loading');
                
                if (data.success) {
                    terminalOutput.textContent = '✅ COMPILATION SUCCESSFUL\n\n' + (data.output || 'No errors or warnings.') + '\n\nReady to run program...';
                    document.getElementById('runBtn').disabled = false;
                } else {
                    terminalOutput.textContent = '❌ COMPILATION FAILED\n\n' + data.output;
                    compileBtn.disabled = false;
                }
            } catch (error) {
                terminalOutput.classList.remove('loading');
                terminalOutput.textContent = `❌ Compilation request failed: ${error.message}`;
                compileBtn.disabled = false;
            }
        }

        // Run program
        async function runProgram() {
            const terminalOutput = document.getElementById('terminalOutput');
            const runBtn = document.getElementById('runBtn');
            
            runBtn.disabled = true;
            terminalOutput.textContent = '⏳ Running program with LD_PRELOAD wrapper...\n\n';
            terminalOutput.classList.add('loading');
            
            try {
                const response = await fetch(`${API_BASE}/run`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                terminalOutput.classList.remove('loading');
                
                if (data.success) {
                    let output = '🚀 PROGRAM EXECUTION\n\n' + data.output;
                    
                    if (data.hung) {
                        output += '\n\n⚠️  PROGRAM HUNG (Deadlock likely occurred!)';
                        output += '\n    The program was terminated after timeout.';
                        output += '\n    Lock events have been captured.';
                    }
                    
                    output += '\n\n✅ Ready to analyze for deadlock...';
                    
                    terminalOutput.textContent = output;
                    document.getElementById('analyzeBtn').disabled = false;
                } else {
                    terminalOutput.textContent = '❌ EXECUTION FAILED\n\n' + data.output;
                    runBtn.disabled = false;
                }
            } catch (error) {
                terminalOutput.classList.remove('loading');
                terminalOutput.textContent = `❌ Execution request failed: ${error.message}`;
                runBtn.disabled = false;
            }
        }

        // Analyze deadlock
        async function analyzeDeadlock() {
            const analysisResult = document.getElementById('analysisResult');
            const analyzeBtn = document.getElementById('analyzeBtn');
            
            analyzeBtn.disabled = true;
            analysisResult.textContent = '⏳ Analyzing lock events for deadlock...\n\nRunning DFS cycle detection...\n';
            analysisResult.classList.add('loading');
            
            try {
                const response = await fetch(`${API_BASE}/analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                analysisResult.classList.remove('loading');
                
                if (data.success) {
                    if (data.deadlock) {
                        analysisResult.innerHTML = '<span class="deadlock-detected">🚨 DEADLOCK DETECTED!</span>\n\n' + data.output;
                    } else {
                        analysisResult.innerHTML = '<span class="no-deadlock">✅ NO DEADLOCK DETECTED</span>\n\n' + data.output;
                    }
                } else {
                    analysisResult.textContent = '❌ ANALYSIS FAILED\n\n' + (data.error || 'Unknown error');
                }
                
                analyzeBtn.disabled = false;
            } catch (error) {
                analysisResult.classList.remove('loading');
                analysisResult.textContent = `❌ Analysis request failed: ${error.message}`;
                analyzeBtn.disabled = false;
            }
        }

        // Health check on load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                if (data.status === 'ok') {
                    console.log('✅ Backend is running');
                }
            } catch (error) {
                console.error('❌ Backend not reachable:', error);
                document.getElementById('terminalOutput').textContent = '⚠️  Backend server not running!\n\nPlease start: python3 simple_server.py';
            }
        });
    </script>
</body>
</html>
